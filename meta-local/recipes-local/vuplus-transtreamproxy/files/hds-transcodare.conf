# Transcodarea spre telefon pe portul 8002 (numai IPv4), pornita de /etc/init.d/hds-transcodare cu
# `busybox inetd -f /etc/hds-transcodare.conf`: pentru fiecare legatura hds-transcodare-poarta, care lasa mai departe
# spre /usr/bin/transtreamproxy numai legaturile din reteaua de acasa. Cel mult 10 legaturi pe minut (nowait.10): codorul
# placii are una sau doua iesiri. Portul il schimba pluginul TransCodingSetup (primul camp al randului de mai jos).
8002	stream	tcp	nowait.10	root	/usr/sbin/hds-transcodare-poarta	hds-transcodare-poarta
