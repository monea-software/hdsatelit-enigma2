# Telnet pe portul 23 (numai IPv4), pornit de /etc/init.d/hds-ssh cu `busybox inetd /etc/hds-telnet-inetd.conf`: pentru
# fiecare legatura un `telnetd -i` cu programul de logare hds-telnet-poarta (din casa root fara parola cand „Fara
# parola in reteaua locala” e pornita, altfel cu parola; din afara casei legatura se inchide). Cel mult 20 de legaturi
# pe minut (nowait.20), ca un port 23 deschis din greseala in router sa nu umple receptorul de procese.
23	stream	tcp	nowait.20	root	/bin/busybox	telnetd -i -l /usr/sbin/hds-telnet-poarta
