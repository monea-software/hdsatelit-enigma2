# /etc/vsftpd.conf: serverul FTP al receptorului HDSatelit (vsftpd). Utilizatorul root, cu parola receptorului: aceeasi
# pentru FTP, SSH si SFTP, aleasa in Setari > Retea & Conexiuni > Parola receptorului (si in interfata web). Verificarea
# parolei si reteaua de acasa sunt in /etc/pam.d/vsftpd. Toate optiunile: vsftpd.conf(5).

# de sine statator (fara inetd), portul 21, numai IPv4: adresa clientului ajunge la PAM ca a.b.c.d, pe care pam_access
# o potriveste cu retelele de acasa. Pe un soclu IPv6 (listen_ipv6) ar ajunge ::ffff:a.b.c.d, iar pam_access 1.7.1 nu
# potriveste retelele IPv6 scrise cu prefix (/104, chiar si /128): FTP ar refuza pe toata lumea.
listen=YES
listen_ipv6=NO

# fara utilizator anonim; conturile receptorului (root) cu parola lor, prin PAM
anonymous_enable=NO
local_enable=YES
pam_service_name=vsftpd
userlist_enable=NO
tcp_wrappers=NO
# root are /bin/sh, dar /etc/shells nu se cere
check_shell=NO

# scriere, fisierele noi cu drepturile obisnuite (rw-r--r--)
write_enable=YES
local_umask=022

# root incepe in / si vede tot receptorul (stickul, discul, /etc/enigma2), fara inchidere intr-un dosar
chroot_local_user=NO
local_root=/

# ora locala in liste (FEAT anunta UTF8: numele fisierelor merg asa cum sunt pe disc)
use_localtime=YES

# legaturile de date numai cu calculatorul care s-a logat (fara FXP), PORT fara portul 20
pasv_promiscuous=NO
port_promiscuous=NO
connect_from_port_20=NO

dirmessage_enable=NO
xferlog_enable=NO
