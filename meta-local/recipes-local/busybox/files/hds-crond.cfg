# crond si crontab in busybox (0.7.4): sarcinile programate ale pluginurilor. Fara trimitere pe e-mail; cu @reboot,
# @daily si celelalte. Dosarul: /var/spool/cron/crontabs (legatura spre /etc/cron/crontabs, din busybox-cron).
CONFIG_CROND=y
CONFIG_FEATURE_CROND_D=y
# CONFIG_FEATURE_CROND_CALL_SENDMAIL is not set
CONFIG_FEATURE_CROND_SPECIAL_TIMES=y
CONFIG_FEATURE_CROND_DIR="/var/spool/cron"
CONFIG_CRONTAB=y
