# Descrierea partii a doua pentru Vu+ Zero (masina vuzero, MIPS, NAND 256 MB; agentul MVZ, 12.11.2026). Aceleasi valori ca
# la Vu+ Solo SE V1 (files/modele/vusolose.conf): acelasi NAND de 256 MB, acelasi UBI, aceeasi imagine mica (~72 MiB liberi
# dupa instalare, masurat pe Solo SE V1; lucru-sesiune/oe-60/mips-solose/STADIU-STICK.md, sectiunea 1).
# PACHETE: ce merge in partea a doua (acum numai limbile; ro si en sunt in imagine).
PACHETE=enigma2-hdsatelit-po-toate
# sub cati MiB liberi in memoria interna se ofera stickul la pornire
PRAG_MIB=150
# marimea fisierului ext4 de pe stick (sub limita FAT32 de 4 GiB)
MARIME_MIB=1024
# trasaturile ext4 pe care le stie nucleul masinii (linux-vuplus 3.13.5): fara metadata_csum, 64bit, orphan_file
EXT4=has_journal,ext_attr,resize_inode,dir_index,filetype,extent,flex_bg,sparse_super,large_file,huge_file,uninit_bg,dir_nlink,extra_isize
# cate secunde asteapta pornirea stickul legat (inainte de Enigma2)
ASTEAPTA_S=10
