# Descrierea partii a doua pentru Zgemma Star S (masina sh1, MACHINEBUILD zgemmass, MIPS, NAND; agentul MSS, 12.11.2026).
# Aceleasi valori ca la Vu+ Solo SE V1 (files/modele/vusolose.conf): aceeasi imagine mica (romana si engleza in imagine,
# restul limbilor pe stick). Marimea NAND-ului Star S nu e inca masurata (FLASHSIZE 256 in sh1.conf; nucleul ia 6 MiB din
# el, sistemul restul); pragul si marimea se reiau dupa ce testerul trimite /proc/mtd si df.
# PACHETE: ce merge in partea a doua (acum numai limbile, ca la Solo SE).
PACHETE=enigma2-hdsatelit-po-toate
# sub cati MiB liberi in memoria interna se ofera stickul la pornire
PRAG_MIB=150
# marimea fisierului ext4 de pe stick (sub limita FAT32 de 4 GiB)
MARIME_MIB=1024
# trasaturile ext4 pe care le stie orice nucleu al nostru de pe MIPS (aceeasi lista ca pe 3.13.5; 4.10.12 le stie pe toate)
EXT4=has_journal,ext_attr,resize_inode,dir_index,filetype,extent,flex_bg,sparse_super,large_file,huge_file,uninit_bg,dir_nlink,extra_isize
# cate secunde asteapta pornirea stickul legat (inainte de Enigma2)
ASTEAPTA_S=10
