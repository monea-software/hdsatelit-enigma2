# Descrierea partii a doua pentru Vu+ Solo SE (masina vusolose, MIPS, NAND 256 MB la V1 si 512 MB la V2; lotul mips-solose,
# 06.11.2026). Singurul fisier pe model al componentei hdsatelit-partea-doua (motorul: Components/HdsParteaDoua.py).
# Masuratorile: lucru-sesiune/oe-60/mips-solose/STADIU-STICK.md, sectiunea 1 (V1: ~72 MiB liberi dupa instalare, V2: ~300).
# PACHETE: ce merge in partea a doua (metapachetul hdsatelit-partea-doua-continut depinde de ele). Acum numai limbile
# (enigma2-hdsatelit-po-toate: toate limbile interfetei; ro si en sunt deja in imagine). hds-ocr, hds-ocr-modele si
# hds-navigator intra aici numai dupa ce sunt construite pentru mips32el si trec auditul scripturilor lor
# Vezi STADIU-STICK.md, sectiunea POARTA pentru navigator si OCR.
PACHETE=enigma2-hdsatelit-po-toate
# sub cati MiB liberi in memoria interna se ofera stickul la pornire (V1 da ~72: intreaba; V2 ~300: nu intreaba, dar se
# poate porni din meniu)
PRAG_MIB=150
# marimea fisierului ext4 de pe stick (sub limita FAT32 de 4 GiB); toate functiile au ~220 MB necomprimat
MARIME_MIB=1024
# trasaturile ext4 pe care le stie nucleul masinii (linux-vuplus 3.13.5): fara metadata_csum, 64bit, orphan_file
EXT4=has_journal,ext_attr,resize_inode,dir_index,filetype,extent,flex_bg,sparse_super,large_file,huge_file,uninit_bg,dir_nlink,extra_isize
# cate secunde asteapta pornirea stickul legat (inainte de Enigma2)
ASTEAPTA_S=10
