# Placa Wi-Fi USB rtl8188fu se incarca dupa modalias (udev, 80-drivers.rules, si modload.sh din rcS), amandoua prin
# modprobe/libkmod, care citesc randul de mai jos: driverul se incarca normal, apoi jurnalul lui coboara la erori.
install rtl8188fu /sbin/modprobe --ignore-install rtl8188fu $CMDLINE_OPTS && /usr/sbin/hds-wifi-jurnal
