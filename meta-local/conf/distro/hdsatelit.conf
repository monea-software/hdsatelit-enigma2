#@TYPE: Distribution
#@NAME: HDSatelit
#@DESCRIPTION: Embedded Linux Distribution Configuration for HDSatelit (Monea Software pentru HD Satelit)

# Configuratia distributiei HD Satelit, scrisa de la zero si de sine statatoare: nu incarca configuratia altei
# distributii (env.source porneste mediul cu DISTRO=hdsatelit). Codul enigma2 vine numai din depozitul nostru
# (enigma2-hdsatelit.bb, SRC_URI = git:///hds/hdsatelit-image).
# Setarile tehnice de mai jos (optimizarile de compilare, DISTRO_FEATURES, managerul de init si de logare,
# arhitecturile pachetelor) sunt conventiile comune ale cadrului OE-Alliance. Cele doua include-uri de mai jos
# (unstable-versions.inc, update-section.inc) sunt in locul comun `meta-oe-alliance/meta-oe/conf/distro/include/`
# si contin numai metadate tehnice (categoriile pachetelor din feed).

DISTRO_FEATURES_BACKFILL_CONSIDERED += "pulseaudio"

OE_TERMINAL ?= "auto"
DISTRO_NAME = "hdsatelit"
DISPLAY_DISTRO = "HDSatelit"
# Versiunea imaginii. Se schimba ODATA cu AC_INIT din configure.ac al depozitului hdsatelit-image (acela da
# versiunea din ecranul Despre si din jurnalul de versiuni), cu PV din recipes-local/images/hdsatelit-image.bb si cu
# PV din recipes-local/enigma2-hdsatelit/enigma2-hdsatelit.bb. Un x.y nou e o imagine noua, scrisa de pe stick;
# actualizarile prin pachete schimba numai al treilea numar.
DISTRO_VERSION = "0.6.13"
DISTRO_TYPE ?= "release"
BUILD_VERSION = "${DATE}"
BUILD_VERSION[vardepsexclude] += "DATE"
BB_HASH_IGNORE_MISMATCH = "1"
DEFAULT_TIMEZONE = "Europe/Bucharest"
STATIC_FEED = "1"
STATIC_ARCH = "static-${MACHINE} static-${TUNE_PKGARCH}"
SMALLBOXWIZARD = "1"
KBUILD_BUILD_USER = "HDSatelit"
KBUILD_BUILD_HOST = "hdsatelit.com"
MAINTAINER = "Monea Software pentru HD Satelit"
HOMEPAGE = "https://hdsatelit.com"
PACKAGE_LIST = "1"

IPKG_VARIANT = "opkg"

# Feedul propriu de pachete, pe stb.hdsatelit.com (serverul nostru), legat de versiunea imaginii: o imagine 0.4.0 nu ia
# pachetele facute pentru alta imagine. Reteta hdsatelit-feed scrie din el /etc/opkg/hdsatelit-feed.conf (canalul
# public). Nicio adresa a altei echipe. Canalul de proba nu vine din imagine: il pune trusa (scripturi/
# pune-feed-proba.sh), cu parola in /home/root/.netrc. Inainte de lansarea imaginii, feedul ei public trebuie sa existe
# pe server (macar gol: unelte/stb/publica_feed.py public-gol <versiunea>), altfel opkg update da eroare.
FEED_NAME = "${DISTRO_NAME}-${DISTRO_VERSION}"
DISTRO_FEED_URI = "https://stb.hdsatelit.com/feed/public/${DISTRO_VERSION}"
STATIC_DISTRO_FEED_URI = ""
DISTRO_FEED_PREFIX = "hdsatelit"

IMAGE_VERSION ?= "${DISTRO_VERSION}"
IMAGE_NAME = "${DISTRO_NAME}-${IMAGE_VERSION}-${MACHINEBUILD}-${DATE}"
IMAGE_NAME[vardepsexclude] += "DATE"
IMAGE_ROOTFS = "${TMPDIR}/rootfs/${MACHINE}"
IMAGE_LINK_NAME = ""
CACHE ?= "${TMPDIR}/cache/${LIBC}/${MACHINE}"
DEPLOY_DIR ?= "${TMPDIR}/deploy/${LIBC}"
DEPLOY_DIR_IMAGE = "${DEPLOY_DIR}/images/${MACHINE}"

require conf/distro/include/unstable-versions.inc
require conf/distro/include/update-section.inc

VIRTUAL-RUNTIME_dev_manager = "eudev"
VIRTUAL-RUNTIME_login_manager = "busybox"
VIRTUAL-RUNTIME_init_manager = "sysvinit"
VIRTUAL-RUNTIME_initscripts = "initscripts"

# OE optimization defaults to -O2 which makes for much larger binaries.
# Override here to use -Os instead, resulting in smaller images.
FULL_OPTIMIZATION = "-Os ${DEBUG_LEVELFLAG}"
# build some core libs with better compiler optimization for better performance
O3_OPT = "-O3 ${DEBUG_LEVELFLAG}"
FULL_OPTIMIZATION:pn-flac = "${O3_OPT}"
FULL_OPTIMIZATION:pn-jpeg = "${O3_OPT}"
FULL_OPTIMIZATION:pn-lame = "${O3_OPT}"
FULL_OPTIMIZATION:pn-liba52 = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libdca = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libgcrypt = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libmad = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libogg = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libpng = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libsamplerate = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libvorbis = "${O3_OPT}"
FULL_OPTIMIZATION:pn-tremor = "${O3_OPT}"
FULL_OPTIMIZATION:pn-zlib = "${O3_OPT}"

# Use upx to compress some binaries for boxes with up to this flash-size (Must be a power of 2 larger or equal 64):
COMPRESS_UPTO = "256"

PREFERRED_VERSION_netatalk ?= "2.2.3"

# wpa-supplicant (reparatii de securitate, ca libxml2 si freetype): `meta-oe/conf/layer.conf` are
# deja `PREFERRED_VERSION_wpa-supplicant ?= "2.11"` (implicit SLAB, dar castiga fara opozitie -- confirmat
# direct cu `bitbake -e wpa-supplicant`, nu presupus). Fara linia de mai jos, reteta noua din meta-local
# (wpa-supplicant_2.12.bb) ar fi ignorata complet, indiferent ce PV are. Asignare TARE (nu `?=`), ca sa
# castige garantat, indiferent de ordinea de citire a straturilor.
PREFERRED_VERSION_wpa-supplicant = "2.12"

# Retetele noi din stratul nostru pentru reparatiile de securitate (recipes-local: openssl, expat, libpng,
# ntfs-3g-ntfsprogs, libsoup, dropbear). Asignare tare, ca sa castige indiferent de ordinea straturilor.
# Retetele noi sunt numai pentru receptor (fara BBCLASSEXTEND native): variantele native, unelte de constructie, raman
# cele din straturile comune si vin din sstate; altfel python3-native si aproape toate uneltele native s-ar construi
# din nou. Bitbake cauta PREFERRED_VERSION_<pn> dupa PN-ul exact al variantei, deci randurile de mai jos nu ating
# variantele -native.
PREFERRED_VERSION_openssl = "3.6.5"
PREFERRED_VERSION_expat = "2.9.0"
PREFERRED_VERSION_libpng = "1.6.59"
PREFERRED_VERSION_ntfs-3g-ntfsprogs = "2026.9.28"
PREFERRED_VERSION_libsoup = "3.8.0"
PREFERRED_VERSION_dropbear = "2026.94"

DISTRO_FEATURES = "${DISTRO_FEATURES_EXTRA} acl bluez5 directfb gtk-directfb pulseaudio alsa argp bluetooth ext2 ipv4 ipv6 irda ldconfig mplt pcmcia wifi wifi-extra xattr nfs smbfs zeroconf pci pam \
                    ${@bb.utils.contains('TARGET_ARCH', 'aarch64', '' , 'ld-is-gold', d)} gobject-introspection-data e2hotplug"

QA_LOG = "1"
QA_LOGFILE = "${TMPDIR}/qa.log"

OEINCLUDELOGS ?= "yes"
KERNEL_CONSOLE ?= "ttyS0,115200n8"

BB_GENERATE_MIRROR_TARBALLS ??= "0"

NO32LIBS ??= "1"

# Missing checksums should raise an error
BB_STRICT_CHECKSUM = "0"

# Drop unused PACKAGE_EXTRA_ARCHS
PACKAGE_EXTRA_ARCHS = "${TUNE_PKGARCH} ${OEM_ARCH} ${STATIC_ARCH}"

# add support for extra feeds
PACKAGE_ARCHS += " private"

LICENSE_FLAGS_ACCEPTED = "commercial"
COMMERCIAL_AUDIO_PLUGINS ?= "gstreamer1.0-plugins-ugly-mad"
COMMERCIAL_VIDEO_PLUGINS ?= "gstreamer1.0-plugins-ugly-mpeg2dec"

# gstreamer1.0-libav: stratul comun al marcii Amiko (meta-brands/meta-amiko/conf/machine/include/amiko-hisi.inc,
# MACHINE_EXTRA_RRECOMMENDS) il recomanda pentru toate masinile familiei, peste FFmpeg-ul stratului comun, care nu se
# poate redistribui. In imagine intra numai prin hdsatelit-base (RDEPENDS) si numai peste FFmpeg-ul nostru restrans,
# LGPL (recipes-local/ffmpeg/ffmpeg_8.%.bbappend: WMA 1/2, ALAC, TrueHD/MLP, DTS fara LBR, codorul AC3). Nu mai e in
# BAD_RECOMMENDATIONS: acolo opkg l-ar fi tinut "deinstall hold" si dependinta din hdsatelit-base n-ar fi intrat.
#
# Bibliotecile de decriptare a discurilor nu se construiesc deloc (nici in imagine, nici in dosarul de pachete): CSS
# (libdvdcss) si AACS (libaacs), plus libbluray, care le cere. FFmpeg-ul nostru nu mai foloseste libbluray. Daca o
# reteta a imaginii le cere vreodata, constructia se opreste aici, nu in tacere.
SKIP_RECIPE[libdvdcss] = "imaginea HD Satelit nu contine decriptare CSS"
SKIP_RECIPE[libaacs] = "imaginea HD Satelit nu contine decriptare AACS"
SKIP_RECIPE[libbluray] = "cere libaacs si libdvdcss; imaginea HD Satelit nu reda Blu-ray"

INHERIT += "rm-pycache"

# Sursele programelor GPL, LGPL si MPL din imagine se pastreaza la fiecare construire (classes/hds-surse.bbclass:
# archiver cu sursa originala, peticele si reteta, numai retetele pentru receptor, fara licentele inchise); arhiva sursei
# unei versiuni se strange din ele dupa construire (surse_versiune.py din uneltele de construire). Prima construire cu
# clasa descarca si arhiveaza sursele tuturor retetelor pentru receptor (cam 10 minute si 720 MB in tmp/deploy/sources);
# dupa aceea arhivele vin din sstate.
INHERIT += "hds-surse"

# retetele de softcam-uri ale distributiilor din stratul comun: nu sunt ale imaginii si nu se citesc
BBMASK += "meta-oe/recipes-distros/[^/]+/softcams/"

# Retetele generice enigma2 si enigma2-skins din stratul comun (nu cele proprii, enigma2-hdsatelit si hdsatelit-skin)
# cad la citire cu DISTRO_NAME="hdsatelit": enigma2.bb calculeaza o suma pe ${ENIGMA2_URI} (nedefinit aici: codul
# enigma2 vine numai din depozitul nostru), iar enigma2-skins.bb cere un fisier "skinsnotwanted" intr-un dosar numit
# dupa distributie. Imaginea nu foloseste niciuna dintre ele, deci BBMASK le scoate de tot din citire.
BBMASK += "meta-oe/recipes-oe-alliance/enigma2/enigma2.bb"
BBMASK += "meta-oe/recipes-oe-alliance/enigma2-skins/enigma2-skins.bb"
