#@TYPE: Distribution
#@NAME: HDSatelit
#@DESCRIPTION: Embedded Linux Distribution Configuration for HDSatelit (Monea Software pentru HD Satelit)

# Configuratia distributiei HD Satelit, scrisa de la zero si de sine statatoare: nu incarca configuratia altei
# distributii (env.source porneste mediul cu DISTRO=hdsatelit). Codul enigma2 vine numai din depozitul nostru
# (enigma2-hdsatelit.bb, SRC_URI = git:///hds/hdsatelit-image).
# Setarile tehnice de mai jos (optimizarile de compilare, DISTRO_FEATURES, managerul de init si de logare,
# arhitecturile pachetelor) sunt conventiile comune ale cadrului OE-Alliance. Cele doua include-uri de mai jos
# (unstable-versions.inc, update-section.inc) sunt in locul comun `meta-oe-alliance/meta-oe/conf/distro/include/`
# si contin numai metadate tehnice (categoriile pachetelor din feed).

# 6.0: BACKFILL_CONSIDERED a devenit OPTED_OUT; implicitele 6.0 nu intra, ramane lista de mai jos
DISTRO_FEATURES_OPTED_OUT = "${DISTRO_FEATURES_DEFAULTS}"

OE_TERMINAL ?= "auto"
DISTRO_NAME = "hdsatelit"
DISPLAY_DISTRO = "HDSatelit"
# Receptoarele cu memorie interna mica (NAND de 256 MB, sistemul pe UBIFS): Vu+ Solo SE (lotul mips-solose, 06.11.2026);
# Vu+ Solo2 si Zgemma Star S (masina sh1) vin dupa el. Pe ele retetele noastre au suprascrierea hdsflashmic: ce nu e
# strict necesar (navigatorul, recunoasterea textului, limbile afara de romana si engleza ...) sta in feedul imaginii si
# se instaleaza la cerere (Eduard, 06.11.2026 07:52-07:57: „exact ce trebuie la fiecare”, NUMAI pe receptoarele cu
# memorie putina). FLASHSIZE nu se poate folosi: meta-oe/conf/layer.conf il pune implicit 256 si pe masinile cu eMMC.
# Pe celelalte masini expresia da "" si DISTROOVERRIDES ramane cel de pana acum.
HDS_VARIANTA ?= "nand"
HDS_MASINI_FLASH_MIC = "vusolose vusolo2 vuzero sh1"
DISTROOVERRIDES:append = "${@':hdsflashmic' if d.getVar('HDS_VARIANTA') != 'usb' and d.getVar('MACHINE') in (d.getVar('HDS_MASINI_FLASH_MIC') or '').split() else ''}"
DISTROOVERRIDES:append = "${@':hdsusb' if d.getVar('HDS_VARIANTA') == 'usb' and d.getVar('MACHINE') == 'vusolose' else ''}"
# Vu+ Duo2 (V22, 14.11.2026): memorie NAND, dar de 1 GB (vuduo2.conf: FLASHSIZE 1024), deci NU memorie mica: fara
# hdsflashmic, limbile si completarile raman in imagine (regula 13.11.2026 11:44). Garda stocare=nand din
# recipes-local/images/hdsatelit-image.bb primeste si masinile din lista asta.
HDS_MASINI_NAND_MARE = "vuduo2 h8 h8se"
# Dreambox (V21B): retetele meta-dream (dreambox-secondstage, linux-dreambox) sunt in BBLAYERS numai pe masinile Dreambox
# (dm*); pe celelalte .bbappend-urile noastre pentru ele ar opri bitbake la citire (AC2, 15.11.2026: constructia V20 cazuta).
BBMASK += "${@'' if (d.getVar('MACHINE') or '').startswith('dm') else '/meta-local[^/]*/recipes-local/(dreambox-secondstage|linux-dreambox)/'}"
# Brand kernel appends require the matching OE-Alliance layer collection.
BBMASK += "${@'' if 'airdigital-layer' in (d.getVar('BBFILE_COLLECTIONS') or '').split() else '/meta-local[^/]*/recipes-local/linux-airdigital/'}"
BBMASK += "${@'' if 'vuplus-layer' in (d.getVar('BBFILE_COLLECTIONS') or '').split() else '/meta-local[^/]*/recipes-local/linux-vuplus/'}"
# XBS8 (22.11.2026): peticul mn88472 pentru Vu+ Duo 4K Lite (reteta linux-vuplus_4.1.20 din meta-vuplusde), numai cu stratul ei
BBMASK += "${@'' if 'vuplusde-layer' in (d.getVar('BBFILE_COLLECTIONS') or '').split() else '/meta-local[^/]*/recipes-local/linux-vuplusde/'}"
# Imaginea mica (0.7.4, 10.11.2026; lucru-sesiune/oe-60/imagine-mica/PROIECT-IMAGINE-MICA.md): limbile interfetei care
# raman in imagine, in pachetul enigma2-hdsatelit (hotararea din 30.10.2026: 15 native, restul din feed). Celelalte devin
# pachete enigma2-hdsatelit-po-<limba> (recipes-local/enigma2-hdsatelit), iar paza imaginii
# (recipes-local/images/hdsatelit-image.bb, hds_paza_imagine_mica) cere exact aceste cataloage in radacina. Pe
# receptoarele cu memorie mica (hdsflashmic) ramane impartirea lor: numai romana si engleza in imagine.
HDS_LIMBI_NATIVE ?= "ro en de fr es it pt nl pl cs hu ru tr uk sk"
HDS_LIMBI_FEED_NUMAR ?= "16"
# Completarile in imagine (0.7.5; Eduard, 13.11.2026 11:44: „Daca imaginea si completarile incap, ar trebui sa fie toate
# completarile in imagine, sa nu mai fie nevoie nici din feed sa le ia”; masuratorile: lucru-sesiune/paralel-1111b/
# runda-0013/STADIU-CPL.md). Pe toate masinile cu memorie interna eMMC intra in imagine cele 15 limbi din feed
# (enigma2-hdsatelit-po-<limba>, HDS_LIMBI_DIN_FEED; po-toate se face numai pe hdsflashmic), recunoasterea textului (hds-ocr, hds-ocr-modele; nu pe MIPS) si driverele USB din feed
# (hdsatelit-drivere-feed), deci dupa prima pornire nu se mai descarca nimic: codul imaginii verifica intai ce exista
# (catalogul limbii, programul OCR, modulul incarcat de udev). Numai pe masinile cu memorie mica (HDS_MASINI_FLASH_MIC, NAND
# de 256 MB, adica exact cele cu suprascrierea hdsflashmic) raman in feed, instalate singure dupa prima pornire. Varianta lor
# pe stick (HDS_VARIANTA = usb, suprascrierea hdsusb: Vu+ Solo SE prin USB / chkroot, radacina pe stick, GB de loc; coordonatorul
# 13.11.2026 15:30, dupa regula lui Eduard „unde incape, in imagine”) are si ea totul in imagine, fara OCR (MIPS). Conditia e
# aceeasi ca la hdsflashmic de mai sus. Locul: pe HiSilicon ext4-ul de constructie creste la 768 MiB
# (recipes-local/images/hdsatelit-image.bb); pe receptor sloturile sunt in userdata (GB).
HDS_COMPLETARI_IN_IMAGINE ?= "${@'0' if d.getVar('HDS_VARIANTA') != 'usb' and d.getVar('MACHINE') in (d.getVar('HDS_MASINI_FLASH_MIC') or '').split() else '1'}"
# limbile care nu sunt native (impartite in pachete de enigma2-hdsatelit.bb; numarul lor e HDS_LIMBI_FEED_NUMAR, verificat acolo
# si in paza imaginii, deci o limba noua in po/Makefile.am se vede la constructie)
# UZB 14.11.2026: uzbeca (uz), a 31-a limba, din feed (nenativa)
HDS_LIMBI_DIN_FEED ?= "ar ca da el et fi fy hr is lt lv no sl sr sv uz"
HDS_COMPLETARI_PACHETE ?= "${@' '.join('enigma2-hdsatelit-po-' + l for l in (d.getVar('HDS_LIMBI_DIN_FEED') or '').split())} hds-ocr hds-ocr-modele hdsatelit-drivere-feed"
# Afisajul color (/usr/share/enigma2/HDSatelit/afisaj-color, 13,8 MB) sta numai in imaginile receptoarelor cu LCD color
# (Components/HdsAfisajColor.py, MODELE; hotararea A din 10.11.2026): Vu+ Solo 4K, Duo 4K, Duo 4K SE si Uno 4K SE.
# MODELE mai are gbquad4kpro (400x240), pe care nu-l construim inca: cand intra, primeste si el randul lui aici.
HDS_AFISAJ_COLOR ?= "0"
HDS_AFISAJ_COLOR:vusolo4k = "1"
HDS_AFISAJ_COLOR:vuultimo4k = "1"
HDS_AFISAJ_COLOR:vuduo4k = "1"
HDS_AFISAJ_COLOR:vuduo4kse = "1"
HDS_AFISAJ_COLOR:vuuno4kse = "1"
# Vu+ Duo 4K Lite (VU1, 12.11.2026): afisajul color 400x240 (colorlcd400 in vuduo4klite.conf, OE-Alliance)
HDS_AFISAJ_COLOR:vuduo4klite = "1"
# GigaBlue UHD Quad 4K Pro (ALFA, 12.11.2026): afisajul color 400x240 (colorlcd400 in gb7252.conf, randul gbquad4kpro)
HDS_AFISAJ_COLOR:gbquad4kpro = "1"
# DM900/DM920: Dream lcd.ko, 400x240 BGR_565_LE.
HDS_AFISAJ_COLOR:dm900 = "1"
HDS_AFISAJ_COLOR:dm920 = "1"
# Versiunea imaginii. Se schimba ODATA cu AC_INIT din configure.ac al depozitului hdsatelit-image (acela da
# versiunea din ecranul Despre si din jurnalul de versiuni), cu PV din recipes-local/images/hdsatelit-image.bb si cu
# PV din recipes-local/enigma2-hdsatelit/enigma2-hdsatelit.bb. Un x.y nou e o imagine noua, scrisa de pe stick;
# actualizarile prin pachete schimba numai al treilea numar.
DISTRO_VERSION = "0.7.9"
DISTRO_TYPE ?= "release"
BUILD_VERSION = "${DATE}"
BUILD_VERSION[vardepsexclude] += "DATE"
BB_HASH_IGNORE_MISMATCH = "1"
DEFAULT_TIMEZONE = "Europe/Bucharest"
STATIC_FEED = "1"
STATIC_ARCH = "static-${MACHINE} static-${TUNE_PKGARCH}"
SMALLBOXWIZARD = "1"
KBUILD_BUILD_USER = "HDSatelit"
KBUILD_BUILD_HOST = "hdsatelit.com"
MAINTAINER = "Monea Software pentru HD Satelit"
HOMEPAGE = "https://hdsatelit.com"
PACKAGE_LIST = "1"

IPKG_VARIANT = "opkg"

# Feedul propriu de pachete, pe stb.hdsatelit.com (serverul nostru), legat de versiunea imaginii: o imagine 0.4.0 nu ia
# pachetele facute pentru alta imagine. Reteta hdsatelit-feed scrie din el /etc/opkg/hdsatelit-feed.conf (canalul
# public). Nicio adresa a altei echipe. Canalul de proba nu vine din imagine: il pune trusa (scripturi/
# pune-feed-proba.sh), cu parola in /home/root/.netrc. Inainte de lansarea imaginii, feedul ei public trebuie sa existe
# pe server (macar gol: unelte/stb/publica_feed.py public-gol <versiunea>), altfel opkg update da eroare.
# Feedul unic (0.7.9, UNF9): baza feedului (HDS_FEED_BAZA) nu mai e neaparat DISTRO_VERSION. De la HDS_FEED_UNIC
# incoace, imaginile de pe aceeasi linie x.y au toate feedul HDS_FEED_UNIC (stare.json cu "unic": true si imagine_minima
# a celei mai vechi imagini a liniei), deci o imagine intreaga 0.7.10 nu mai face o baza noua de feed. version= din
# /etc/hdsatelit-model ramane DISTRO_VERSION (imaginea scrisa: nucleul, modulele). Imaginile de dinainte de
# HDS_FEED_UNIC si cele de pe alta linie x.y au feedul DISTRO_VERSION, ca pana acum. Pachetul hdsatelit-feed nu intra
# niciodata in feedul unei actualizari: trecerea receptoarelor vechi o face codul imaginii
# (Components/HdsActualizari.py, stare_cu_feedul_unic).
HDS_FEED_UNIC = "0.7.9"
HDS_FEED_BAZA = "${@d.getVar('HDS_FEED_UNIC') if (d.getVar('DISTRO_VERSION') or '').rsplit('.', 1)[0] == d.getVar('HDS_FEED_UNIC').rsplit('.', 1)[0] and int((d.getVar('DISTRO_VERSION') or '0.0.0').rsplit('.', 1)[-1]) >= int(d.getVar('HDS_FEED_UNIC').rsplit('.', 1)[-1]) else d.getVar('DISTRO_VERSION')}"
FEED_NAME = "${DISTRO_NAME}-${DISTRO_VERSION}"
DISTRO_FEED_URI = "https://stb.hdsatelit.com/feed/public/${HDS_FEED_BAZA}"
STATIC_DISTRO_FEED_URI = ""
DISTRO_FEED_PREFIX = "hdsatelit"

IMAGE_VERSION ?= "${DISTRO_VERSION}"
IMAGE_NAME = "${DISTRO_NAME}-${IMAGE_VERSION}-${MACHINEBUILD}-${DATE}"
IMAGE_NAME[vardepsexclude] += "DATE"
IMAGE_ROOTFS = "${TMPDIR}/rootfs/${MACHINE}"
IMAGE_LINK_NAME = ""
CACHE ?= "${TMPDIR}/cache/${LIBC}/${MACHINE}"
DEPLOY_DIR ?= "${TMPDIR}/deploy/${LIBC}"
DEPLOY_DIR_IMAGE = "${DEPLOY_DIR}/images/${MACHINE}${@'-usb' if d.getVar('HDS_VARIANTA') == 'usb' else ''}"

require conf/distro/include/unstable-versions.inc
require conf/distro/include/update-section.inc

VIRTUAL-RUNTIME_dev_manager = "eudev"
VIRTUAL-RUNTIME_login_manager = "busybox"
# 6.0: defaultsetup.conf pune INIT_MANAGER ??= "systemd"; imaginea ramane pe sysvinit
INIT_MANAGER = "sysvinit"
VIRTUAL-RUNTIME_init_manager = "sysvinit"
VIRTUAL-RUNTIME_initscripts = "initscripts"

# OE optimization defaults to -O2 which makes for much larger binaries.
# Override here to use -Os instead, resulting in smaller images.
FULL_OPTIMIZATION = "-Os ${DEBUG_LEVELFLAG}"
# build some core libs with better compiler optimization for better performance
O3_OPT = "-O3 ${DEBUG_LEVELFLAG}"
FULL_OPTIMIZATION:pn-flac = "${O3_OPT}"
FULL_OPTIMIZATION:pn-jpeg = "${O3_OPT}"
FULL_OPTIMIZATION:pn-lame = "${O3_OPT}"
FULL_OPTIMIZATION:pn-liba52 = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libdca = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libgcrypt = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libmad = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libogg = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libpng = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libsamplerate = "${O3_OPT}"
FULL_OPTIMIZATION:pn-libvorbis = "${O3_OPT}"
FULL_OPTIMIZATION:pn-tremor = "${O3_OPT}"
FULL_OPTIMIZATION:pn-zlib = "${O3_OPT}"

# Use upx to compress some binaries for boxes with up to this flash-size (Must be a power of 2 larger or equal 64):
COMPRESS_UPTO = "256"

PREFERRED_VERSION_netatalk ?= "2.2.3"

# wpa-supplicant (reparatii de securitate, ca libxml2 si freetype): `meta-oe/conf/layer.conf` are
# deja `PREFERRED_VERSION_wpa-supplicant ?= "2.11"` (implicit SLAB, dar castiga fara opozitie -- confirmat
# direct cu `bitbake -e wpa-supplicant`, nu presupus). Fara linia de mai jos, reteta noua din meta-local
# (wpa-supplicant_2.12.bb) ar fi ignorata complet, indiferent ce PV are. Asignare TARE (nu `?=`), ca sa
# castige garantat, indiferent de ordinea de citire a straturilor.

# Retetele noi din stratul nostru pentru reparatiile de securitate (recipes-local: openssl, expat, libpng,
# ntfs-3g-ntfsprogs, libsoup, dropbear). Asignare tare, ca sa castige indiferent de ordinea straturilor.
# Retetele noi sunt numai pentru receptor (fara BBCLASSEXTEND native): variantele native, unelte de constructie, raman
# cele din straturile comune si vin din sstate; altfel python3-native si aproape toate uneltele native s-ar construi
# din nou. Bitbake cauta PREFERRED_VERSION_<pn> dupa PN-ul exact al variantei, deci randurile de mai jos nu ating
# variantele -native.

# glibc 2.42: comiterea cea mai noua de pe ramura release/2.42/master (in locul lui e34453cd6a8c, ramas in
# openembedded-core), cu reparatiile de securitate aduse pe ramura (scanf %mc, rezolvarea DNS in gethostbyaddr si
# getnetbyaddr, iconv, wordexp, memalign, ungetwc si celelalte; lista in recipes-local/glibc/glibc_2.42.bbappend).
# In conf, nu intr-un bbappend, pentru ca SRCREV_glibc (pus cu ?= in glibc-version.inc) il folosesc glibc si
# cross-localedef-native. Numai cu imagine noua: glibc nu se schimba prin actualizare, iar schimbarea lui reface
# toate retetele pentru receptor la constructia imaginii.

DISTRO_FEATURES = "${DISTRO_FEATURES_EXTRA} acl bluez5 directfb gtk-directfb pulseaudio alsa argp bluetooth ext2 ipv4 ipv6 irda ldconfig mplt pcmcia wifi wifi-extra xattr nfs smbfs zeroconf pci pam \
                    ${@bb.utils.contains('TARGET_ARCH', 'aarch64', '' , 'ld-is-gold', d)} gobject-introspection-data e2hotplug"

QA_LOG = "1"
QA_LOGFILE = "${TMPDIR}/qa.log"

OEINCLUDELOGS ?= "yes"
KERNEL_CONSOLE ?= "ttyS0,115200n8"

BB_GENERATE_MIRROR_TARBALLS ??= "0"

NO32LIBS ??= "1"

# Missing checksums should raise an error
BB_STRICT_CHECKSUM = "0"

# Drop unused PACKAGE_EXTRA_ARCHS
PACKAGE_EXTRA_ARCHS = "${TUNE_PKGARCH} ${OEM_ARCH} ${STATIC_ARCH}"

# add support for extra feeds
PACKAGE_ARCHS += " private"

LICENSE_FLAGS_ACCEPTED = "commercial"
COMMERCIAL_AUDIO_PLUGINS ?= "gstreamer1.0-plugins-ugly-mad"
COMMERCIAL_VIDEO_PLUGINS ?= "gstreamer1.0-plugins-ugly-mpeg2dec"

# gstreamer1.0-libav: stratul comun al marcii Amiko (meta-brands/meta-amiko/conf/machine/include/amiko-hisi.inc,
# MACHINE_EXTRA_RRECOMMENDS) il recomanda pentru toate masinile familiei, peste FFmpeg-ul stratului comun, care nu se
# poate redistribui. In imagine intra numai prin hdsatelit-base (RDEPENDS) si numai peste FFmpeg-ul nostru restrans,
# LGPL (recipes-local/ffmpeg/ffmpeg_8.%.bbappend: WMA 1/2, ALAC, TrueHD/MLP, DTS fara LBR, codorul AC3). Nu mai e in
# BAD_RECOMMENDATIONS: acolo opkg l-ar fi tinut "deinstall hold" si dependinta din hdsatelit-base n-ar fi intrat.
#
# Bibliotecile de decriptare a discurilor nu se construiesc deloc (nici in imagine, nici in dosarul de pachete): CSS
# (libdvdcss) si AACS (libaacs), plus libbluray, care le cere. FFmpeg-ul nostru nu mai foloseste libbluray. Daca o
# reteta a imaginii le cere vreodata, constructia se opreste aici, nu in tacere.
SKIP_RECIPE[libdvdcss] = "imaginea HD Satelit nu contine decriptare CSS"
SKIP_RECIPE[libaacs] = "imaginea HD Satelit nu contine decriptare AACS"
SKIP_RECIPE[libbluray] = "cere libaacs si libdvdcss; imaginea HD Satelit nu reda Blu-ray"

INHERIT += "rm-pycache"

# Sursele programelor GPL, LGPL si MPL din imagine se pastreaza la fiecare construire (classes/hds-surse.bbclass:
# archiver cu sursa originala, peticele si reteta, numai retetele pentru receptor, fara licentele inchise); arhiva sursei
# unei versiuni se strange din ele dupa construire (surse_versiune.py din uneltele de construire). Prima construire cu
# clasa descarca si arhiveaza sursele tuturor retetelor pentru receptor (cam 10 minute si 720 MB in tmp/deploy/sources);
# dupa aceea arhivele vin din sstate.
INHERIT += "hds-surse"
INHERIT += "hds-surse-60"

# retetele de softcam-uri ale distributiilor din stratul comun: nu sunt ale imaginii si nu se citesc
BBMASK += "meta-oe/recipes-distros/[^/]+/softcams/"

# Retetele generice enigma2 si enigma2-skins din stratul comun (nu cele proprii, enigma2-hdsatelit si hdsatelit-skin)
# cad la citire cu DISTRO_NAME="hdsatelit": enigma2.bb calculeaza o suma pe ${ENIGMA2_URI} (nedefinit aici: codul
# enigma2 vine numai din depozitul nostru), iar enigma2-skins.bb cere un fisier "skinsnotwanted" intr-un dosar numit
# dupa distributie. Imaginea nu foloseste niciuna dintre ele, deci BBMASK le scoate de tot din citire.
BBMASK += "meta-oe/recipes-oe-alliance/enigma2/enigma2.bb"
BBMASK += "meta-oe/recipes-oe-alliance/enigma2-skins/enigma2-skins.bb"

# AB-COM PULSe 4K si PULSe 4K MINI (MPU, 12.11.2026): pulse4k.conf si pulse4kmini.conf din meta-abcom (OE-Alliance 6.0) spun
# MTD_KERNEL = "mmcblk0p20" si MTD_ROOTFS = "mmcblk0p21", dar masina porneste din locul 1 = linuxkernel1 (p19) si userdata
# (p23). Dovezi: bootargs.bin al producatorului (pulse4k-bootargs-20210329, pulse4k/bootargs.bin, acelasi in arhiva de
# recuperare publica OE-Alliance din 12.11.2026): blkdevparts=mmcblk0:...,16M(linuxkernel1),16M(linuxkernel2),
# 16M(linuxkernel3),16M(linuxkernel4),-(userdata), deci p19-p22 si p23; STARTUP_LINUX_1 din abemmc-fastboot8gb_image.bbclass:
# root=/dev/mmcblk0p23 rootsubdir=linuxrootfs1 kernel=/dev/mmcblk0p19 (ca la Zgemma H9 COMBO, aceeasi tabela). p20 e nucleul
# locului 2 si p21 al locului 3. MTD_* ajung numai in /usr/lib/enigma.info (mtdkernel, mtdrootfs: pluginurile de copie le
# citesc) si in paza de model din reteta imaginii (hds_reguli_model cere MTD_* = kernel_part/rootfs_part ale regulilor).
MTD_KERNEL:pulse4k = "mmcblk0p19"
MTD_ROOTFS:pulse4k = "mmcblk0p23"
MTD_KERNEL:pulse4kmini = "mmcblk0p19"
MTD_ROOTFS:pulse4kmini = "mmcblk0p23"

# HDSatelit 0.7.7 (16.11.2026, gasit de WKB): resizerootfs.bbappend-ul nostru (H51, REL7) e pentru o reteta care exista numai
# in straturile unor BSP-uri (meta-brands: gigablue, abcom, ceryon, vuplusde, airdigital, dinobot, maxytec, gfutures, edision);
# pe celelalte masini (Vu+ cu meta-vuplus, sf8008, viper4k, ustym4kpro ...) bbappend-ul fara reteta ar opri bitbake la citire.
# Il ascundem acolo cu BBMASK, ca la Dreambox mai sus. (BB_DANGLINGAPPENDS_WARNONLY nu mai exista in bitbake-ul din 6.0:
# "support for the variable was removed", eroare la citire pe toate masinile; WKB 12:08.) BBMASK nu intra in semnaturile sarcinilor.
BBMASK += "${@'' if any(s in (d.getVar('BBLAYERS') or '') for s in ('meta-gigablue', 'meta-abcom', 'meta-ceryon', 'meta-vuplusde', 'meta-airdigital', 'meta-dinobot', 'meta-maxytec', 'meta-gfutures', 'meta-edision')) else '/meta-local[^/]*/recipes-local/resizerootfs/'}"

# 6.0: spdm-emu opreste citirea pe arhitecturile nesuportate
BBMASK += "meta-openembedded/meta-oe/recipes-security/spdm-emu"
